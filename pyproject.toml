[project]
name = "yogurt"
version = "0.1.0"
description = "Voice- and vision-controlled SO-101 arm that fetches a yogurt cup and hands it over."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.3",
    "msgpack>=1.1",
    "numpy>=2.0,<2.3", # lerobot 0.6 pins numpy<2.3
    "pyyaml>=6.0",
    "pyzmq>=26.2",
]

[project.optional-dependencies]
# Real hardware: follower/leader/head servo buses, plus lerobot-record's dataset + viz deps.
hw = ["lerobot[feetech,core-scripts]>=0.6.1,<0.7"]
# GPU machine (lab box or Adroit): lerobot-train for ACT.
train = ["lerobot[training]>=0.6.1,<0.7"]

[dependency-groups]
dev = [
    "honcho>=2.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "sim: needs the SO-ARM100 MuJoCo model (run scripts/fetch_so_arm100.sh)",
]
