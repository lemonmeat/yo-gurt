[project]
name = "yogurt"
version = "0.2.0"
description = "Yo-gurt: a voice-and-vision SO-101 arm that picks up a yogurt and hands it to whoever asked."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lerobot[feetech,dataset]>=0.6.1,<0.7", # arm bus, ACT policy, demo datasets (brings torch + opencv)
    "aiohttp>=3.9",                         # web UI
    "pyyaml>=6.0",
    "sounddevice>=0.5",                     # stereo mic capture (PortAudio)
    "faster-whisper>=1.1",                  # speech-to-text for the spoken command
    "onnxruntime>=1.20",                    # CPU inference for every model we train
    "torch",                                # via lerobot; listed so the Pi can take the CPU build below
    "torchvision",
    "pyobjc-framework-avfoundation>=10 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Only needed on the machine that trains/exports models (laptop or GPU box), never on the Pi.
train = [
    "lerobot[training]>=0.6.1,<0.7", # lerobot-train for ACT
    "ultralytics>=8.3.100",          # yogurt detector: open-vocabulary export + fine-tuning
    "onnx>=1.17",
    "onnxscript>=0.2",
]

[project.scripts]
yogurt = "yogurt.app:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv]
# ultralytics asks for opencv-python, which overwrites the headless build lerobot pins. One cv2 only.
exclude-dependencies = ["opencv-python"]

# PyPI's Linux aarch64 torch wheels pull in ~2.8 GB of CUDA libraries, useless on the Pi.
# Take the CPU-only build there; x86 Linux (GPU training boxes) and macOS keep PyPI's builds.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
