# SIM PLACEHOLDER. Re-teach on the real arm: uv run python scripts/teach_poses.py --task grasp
# Degrees in LeRobot's calibrated frame; gripper 0 closed .. 100 open. Waypoints may list any
# subset of joints; the rest keep their previous value.
task: grasp
source: sim
waypoints:
  - {duration_s: 2.0, positions: {shoulder_pan: 0, shoulder_lift: -10, elbow_flex: -5, wrist_flex: 85, wrist_roll: 0}, gripper: 100}
  - {duration_s: 1.5, positions: {shoulder_lift: 0, elbow_flex: 10, wrist_flex: 70}}
  # Closing to 20 stands in for the cup stopping the fingers (the sim has no cup).
  - {duration_s: 1.0, gripper: 20}
  - {duration_s: 1.5, positions: {shoulder_lift: -10, elbow_flex: -5, wrist_flex: 85}}
