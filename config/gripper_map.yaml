# Raw STS3215 encoder counts (0..4095) at the gripper's mechanical ends, mapped to 0 (closed) and
# 100 (open). The real backend reads and writes the gripper in raw counts through this map. With
# the stock SO-101 gripper these should match the gripper's range_min/range_max in
# calibration/yogurt_follower.json, which is the scale LeRobot records datasets on.
#
# PLACEHOLDERS until TASKS T2: run `uv run python scripts/gripper_counts.py --arm follower`, close
# the gripper by hand, note the count, open it fully, note the count, then set measured: true.

follower:
  closed_counts: 2000
  open_counts: 3400
  measured: false

