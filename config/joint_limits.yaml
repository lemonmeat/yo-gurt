# Joint limits enforced by arm_driver's safety filter.
#
# Units: degrees in LeRobot's calibrated frame (use_degrees=True, 0 = middle of the range recorded
# during calibration); max_velocity in deg/s. The gripper is 0 (closed) .. 100 (open), %/s.
#
# PLACEHOLDERS until TASKS T1: after calibrating, run `uv run lerobot-find-joint-limits` (or
# teleoperate and watch arm/state), stay a few degrees inside what you see, then set measured: true.
# The real backend refuses to start while measured is false.

follower:
  measured: false
  joints:
    shoulder_pan:  {min: -90.0, max: 90.0, max_velocity: 90.0}
    shoulder_lift: {min: -90.0, max: 90.0, max_velocity: 90.0}
    elbow_flex:    {min: -90.0, max: 90.0, max_velocity: 90.0}
    wrist_flex:    {min: -90.0, max: 90.0, max_velocity: 120.0}
    wrist_roll:    {min: -150.0, max: 150.0, max_velocity: 120.0}
    gripper:       {min: 0.0, max: 100.0, max_velocity: 150.0}

