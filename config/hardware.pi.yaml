# Raspberry Pi 5 + AI HAT+ config, backpack-mounted (YOGURT_HW=pi, set by the systemd units).
# Same code as the laptop; only these values change. Use stable by-id device paths so USB
# re-enumeration can't swap the arms or cameras.
name: pi

bus:
  pub: tcp://127.0.0.1:5550
  sub: tcp://127.0.0.1:5551

follower:
  backend: real
  port: /dev/serial/by-id/TODO-follower  # ls -l /dev/serial/by-id/
  id: yogurt_follower
  calibration_dir: calibration
  rate_hz: 50
  sim_model: third_party/SO-ARM100/Simulation/SO101/scene.xml
  torque_off_on_exit: true
  max_relative_target_deg: 10.0
  fk:
    urdf: third_party/SO-ARM100/Simulation/SO101/so101_new_calib.urdf
    tool_offset: [0.0, 0.0, 0.0]  # TODO: copy from the laptop config once measured
    joint_sign: {}
    joint_offset_deg: {}
  safety:
    watchdog_s: 0.2
    load_trip_s: 0.5
    max_load_pct:
      shoulder_pan: 70
      shoulder_lift: 85
      elbow_flex: 85
      wrist_flex: 70
      wrist_roll: 60
      gripper: 90
    torque_limit_pct: 80
    keep_out_margin_m: 0.03
    keep_out:
      # On the backpack the head sits next to the follower, and the wearer is behind both.
      # TODO: measure both boxes on the mounted frame (Phase 3).
      - name: head
        min: [-0.15, 0.20, 0.00]
        max: [0.10, 0.45, 0.50]
      - name: wearer
        min: [-0.60, -0.40, -0.60]
        max: [-0.08, 0.40, 0.40]

head:
  backend: real
  port: /dev/serial/by-id/TODO-head
  id: yogurt_head
  calibration_dir: calibration
  rate_hz: 30
  torque_off_on_exit: true
  max_relative_target_deg: 10.0
  safety:
    watchdog_s: 0.2
    load_trip_s: 0.5
    max_load_pct: {shoulder_pan: 60, shoulder_lift: 80, elbow_flex: 80, wrist_flex: 60, wrist_roll: 60, gripper: 60}
    torque_limit_pct: 60

leader:  # usually stays on the laptop; listed so scripts work on the Pi too
  port: /dev/serial/by-id/TODO-leader
  id: yogurt_leader
  calibration_dir: calibration

cameras:
  wrist: {device: /dev/v4l/by-id/TODO-wrist-video-index0, width: 800, height: 600, fps: 30}
  scene: {device: /dev/v4l/by-id/TODO-scene-video-index0, width: 800, height: 600, fps: 30}

camera_hub:
  backend: opencv
  ring_slots: 4

audio:
  input_device: null  # TODO: ALSA name of the SPH0645 I2S pair
  sample_rate: 16000
  wake_model: hey_jarvis
  wake_threshold: 0.5
  stop_model: ""
  stop_threshold: 0.5
  i2s_mics: true

vision:
  backend: hailo
  model: models/yolov8n.hef  # TODO: compile or download for Hailo-8L
  camera: scene
  rate_hz: 15
  min_confidence: 0.4

asr:
  model: models/vosk-model-small-en-us-0.15
  grammar: ["get me a yogurt", "bring me a yogurt", "yogurt please", "stop", "[unk]"]
  intents:
    get me a yogurt: fetch
    bring me a yogurt: fetch
    yogurt please: fetch
    stop: stop

tts:
  voice: models/piper/en_US-lessac-medium.onnx
  output_device: null  # TODO: USB speaker ALSA name

sensors:
  enabled: true
  i2c_bus: 1
  ads1115_address: 0x48
  fsr_channel: 0
  battery_channel: 1
  battery_divider: 4.0  # TODO: match the resistor divider on the battery tap
  rate_hz: 20

policy:
  backend: act
  rate_hz: 30
  poses_dir: data/poses
  act:
    checkpoint: ""
    device: cpu
    server: null  # e.g. "gpu-box.local:8080" to run ACT on a GPU via LeRobot's policy server

orchestrator:
  dev_mode: false
  listen: true
  require_cup: true
  default_intent: fetch
  holding_min_gripper: 8.0
  max_grasp_attempts: 2
  stop_repeat_s: 0.5
  timeouts_s:
    LISTEN: 6.0
    CHECK: 3.0
    GRASP: 20.0
    VERIFY: 2.0
    HANDOFF: 30.0
    RELEASE_HOME: 15.0

recorder:
  dir: outputs/logs
  exclude: [audio/pcm]
