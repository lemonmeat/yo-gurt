# Laptop development config (the default; YOGURT_HW=laptop). Relative paths are relative to the
# repository root. Find serial ports with `uv run lerobot-find-port` and camera indices with
# `uv run lerobot-find-cameras opencv` (both need `uv sync --extra hw`).
name: laptop

bus:
  pub: tcp://127.0.0.1:5550
  sub: tcp://127.0.0.1:5551

# 12 V STS3215 arm with the Robonine parallel gripper and the wrist camera. 12 V 5 A supply.
follower:
  backend: sim  # sim | real; arm_driver --backend overrides
  port: /dev/tty.usbmodem_FOLLOWER  # TODO: lerobot-find-port
  id: yogurt_follower
  calibration_dir: calibration
  rate_hz: 50
  sim_model: third_party/SO-ARM100/Simulation/SO101/scene.xml
  torque_off_on_exit: true
  max_relative_target_deg: 10.0
  fk:
    urdf: third_party/SO-ARM100/Simulation/SO101/so101_new_calib.urdf
    # Robonine fingertip relative to the stock gripper_frame_link. TODO: measure on the arm.
    tool_offset: [0.0, 0.0, 0.0]
    joint_sign: {}
    joint_offset_deg: {}
  safety:
    watchdog_s: 0.2
    load_trip_s: 0.5
    max_load_pct:  # TODO: check against arm/state loads during normal teleop and raise if needed
      shoulder_pan: 70
      shoulder_lift: 85
      elbow_flex: 85
      wrist_flex: 70
      wrist_roll: 60
      gripper: 90
    torque_limit_pct: 80
    keep_out_margin_m: 0.03
    keep_out:
      # The head arm and its swept volume. TODO: measure where the head is mounted on the table.
      - name: head
        min: [-0.15, 0.20, 0.00]
        max: [0.10, 0.45, 0.50]

# Extra SO-101 with the stock gripper: carries the scene camera, later the mics. Never the cup.
head:
  backend: sim
  port: /dev/tty.usbmodem_HEAD  # TODO: lerobot-find-port
  id: yogurt_head
  calibration_dir: calibration
  rate_hz: 30
  torque_off_on_exit: true
  max_relative_target_deg: 10.0
  safety:
    watchdog_s: 0.2
    load_trip_s: 0.5
    max_load_pct: {shoulder_pan: 60, shoulder_lift: 80, elbow_flex: 80, wrist_flex: 60, wrist_roll: 60, gripper: 60}
    torque_limit_pct: 60

# 7.4 V servos on a 5 V supply. Never swap supplies with the follower.
leader:
  port: /dev/tty.usbmodem_LEADER  # TODO: lerobot-find-port
  id: yogurt_leader
  calibration_dir: calibration

cameras:
  wrist: {device: 0, width: 800, height: 600, fps: 30}  # DFRobot FIT0892, 140 deg. TODO: index
  scene: {device: 1, width: 800, height: 600, fps: 30}  # DFRobot FIT0729 on the head. TODO: index

camera_hub:
  backend: opencv  # synthetic: test pattern, no cameras needed
  ring_slots: 4

audio:
  input_device: null  # laptop mic
  sample_rate: 16000
  wake_model: hey_jarvis
  wake_threshold: 0.5
  stop_model: ""
  stop_threshold: 0.5
  i2s_mics: false

vision:
  backend: none  # yolo once ultralytics is added
  model: models/yolo11n.pt
  camera: scene
  rate_hz: 10
  min_confidence: 0.4

asr:
  model: models/vosk-model-small-en-us-0.15
  grammar: ["get me a yogurt", "bring me a yogurt", "yogurt please", "stop", "[unk]"]
  intents:
    get me a yogurt: fetch
    bring me a yogurt: fetch
    yogurt please: fetch
    stop: stop

tts:
  voice: models/piper/en_US-lessac-medium.onnx
  output_device: null

sensors:
  enabled: false  # no ADS1115 on the laptop

policy:
  backend: replay  # Phase 1: taught poses; act from Phase 2
  rate_hz: 30
  poses_dir: data/poses
  act:
    checkpoint: ""
    device: mps
    server: null

orchestrator:
  dev_mode: true
  listen: false  # Phase 1: wake word goes straight to "fetch"
  require_cup: false  # Phase 1: no vision yet
  default_intent: fetch
  holding_min_gripper: 8.0
  max_grasp_attempts: 2
  stop_repeat_s: 0.5
  timeouts_s:
    LISTEN: 6.0
    CHECK: 3.0
    GRASP: 20.0
    VERIFY: 2.0
    HANDOFF: 30.0
    RELEASE_HOME: 15.0

recorder:
  dir: outputs/logs
  exclude: [audio/pcm]
