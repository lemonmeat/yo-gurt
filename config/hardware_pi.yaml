# Hardware as seen from the Raspberry Pi 5 + AI HAT+ 2.  Run with:  uv run yogurt pi
# Then open http://<pi-address>:8080 from the laptop (user gurt, password gurt).
# Everything that is the same on every computer (poses, timings, thresholds) lives in robot.yaml.

web:
  host: 0.0.0.0          # reachable on the local network
  port: 8080
  user: gurt
  password: gurt

arm:
  port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B8E115398-if00
  # the only /dev/ttyACM* (after excluding leader.port); or an explicit path
  calibration: config/arm_config.json

leader:
  port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5970072268-if00
  # demos are normally recorded on the laptop
  calibration: config/leader_config.json

cameras:
  # On Linux the name is matched against /dev/v4l/by-id/, which stays put across reboots.
  wrist:
    device: Integrated_Webcam_HD
    width: 1280
    height: 720
    fps: 30
    rotate: 0
    hfov_deg: 120
  base:
    device: UC60
    width: 1280
    height: 720
    fps: 30
    rotate: 0
    hfov_deg: 80

mic:
  device: alsa_input.usb-DSJ_UC60   # the PipeWire source; plain "UC60" also matches the raw ALSA device
  sample_rate: 48000

# .onnx runs on the Pi's CPU, .hef on the AI HAT+ 2 (see README, "Raspberry Pi 5 + AI HAT+ 2").
# A model whose file is missing is reported as not loaded; its state's step-through button still works.
# A .hef that is missing or will not run on the HAT falls back to the .onnx of the same name, on the CPU.
models:
  wake_word: models/wake_word.onnx        # tiny, runs every 100 ms: keep on the CPU
  yogurt_detector: models/yogurt_detector.hef   # `detector hailo` on an x86 Linux box makes it
  grasp_verify: models/grasp_verify.onnx
  handoff_grab: models/handoff_grab.onnx
  act_grasp: models/act_grasp
  act_device: cpu

asr:
  model: tiny.en         # base.en is more accurate but about 3x slower on the Pi
  compute_type: int8

slm:
  url: http://127.0.0.1:11434
  model: gemma3:1b
